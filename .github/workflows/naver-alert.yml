name: naver-realestate-alert

on:
  schedule:
    - cron: '7,37 * * * *'   # 30분 주기
  workflow_dispatch:
    inputs:
      dry_run:
        description: '텔레그램 전송 없이 로그만'
        type: boolean
        default: true
      no_state:
        description: '중복 기록 무시(전체 재검사, 저장 안 함)'
        type: boolean
        default: true
      limit_dongs:
        description: '구별 동 개수 제한 (0=전체)'
        type: string
        default: '2'

concurrency:
  group: naver-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/focused-cori-yaezi0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet requests

      - name: run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.no_state }}" = "true" ]; then ARGS="$ARGS --no-state"; fi
          if [ -n "${{ inputs.limit_dongs }}" ] && [ "${{ inputs.limit_dongs }}" != "0" ]; then
            ARGS="$ARGS --limit-dongs ${{ inputs.limit_dongs }}"
          fi
          echo "args:$ARGS"
          python naver-alert/monitor.py $ARGS

      - name: commit state
        if: github.event_name == 'schedule'
        run: |
          git config user.name  "naver-alert bot"
          git config user.email "noreply@anthropic.com"
          if ! git diff --quiet -- naver-alert/state/seen.json; then
            git add naver-alert/state/seen.json
            git commit -m "chore(naver-alert): 매물 조회 기록 갱신"
            for i in 1 2 3 4; do
              git pull --rebase origin claude/focused-cori-yaezi0 && \
              git push origin HEAD:claude/focused-cori-yaezi0 && exit 0
              sleep $((2 ** i))
            done
            exit 1
          fi
          echo "변경 없음"
